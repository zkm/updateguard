# /etc/updateguard.conf — sourced by bash; every line is optional.

# Start in dry run: hooks check and report but take no snapshots and never
# abort pacman, apt or dnf. Watch one or two kernel updates, then set this to 0.
DRY_RUN=1

# auto picks snapper (config "root") > raw btrfs > none.
# If snap-pac is installed, updateguard records its snapshots instead of making its own.
BACKEND=auto

# Raw btrfs mode: where read-only snapshots of / go (same filesystem as /).
SNAPSHOT_DIR=/.updateguard-snapshots

# How many raw snapshots and boot backups to keep.
KEEP=5

# Copy kernel + initramfs off a separate /boot or ESP before risky updates.
# Root snapshots don't include them, so a rollback without this leaves a
# new kernel on /boot paired with old modules on /.
BOOT_BACKUP=1
BOOT_BACKUP_FALLBACK=0
MAX_BOOT_BACKUP_MB=1024

# Stop the transaction if /boot (or /efi) is in fstab but not mounted.
ABORT_ON_UNMOUNTED_BOOT=1

# Stop the transaction if the snapshot fails.
ABORT_ON_SNAPSHOT_FAIL=0

# Warn when the boot partition has less free space than this.
ESP_MIN_FREE_MB=64

# Use lsinitcpio / lsinitramfs / lsinitrd to confirm each initramfs was built for the right kernel.
CHECK_INITRAMFS_CONTENTS=1

# Packages that match the hook's Target patterns but aren't risky.
EXCLUDE=(linux-api-headers linux-docs 'linux-*-docs' linux-firmware-whence)
